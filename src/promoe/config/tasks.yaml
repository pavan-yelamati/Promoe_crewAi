context_task:
  description: >
    Analyze the provided {message} and extract the underlying context and intent behind it.
    Ensure the context is accurately captured, including any implicit use case or goal.
  expected_output: >
    A concise summary highlighting the inferred context, the potential use case, and any key assumptions made.
  agent: context_analyzer

prompt_creation_task:
  description: >
    Based on the given {message} and the analyzed context provided by context_analyzer, 
    create a clear, detailed, and structured prompt that can be effectively used by a GPT model.
  expected_output: >
    A well-structured prompt that accurately reflects the original message and aligns with the inferred context and intent.
  agent: prompt_creator

prompt_enhancement_task:
  description: >
    Take the prompt generated by the prompt_creator along with the context from context_analyzer 
    and refine it for clarity, completeness, and optimal performance with GPT models.
  expected_output: >
    An enhanced version of the original prompt, with improved phrasing, structure, and contextual alignment.
  agent: prompt_enhancer
